<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lego-Lager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lego-Lager</title>
<style>
:root{--bg:#fff;--ink:#111;--mut:#5f5f5f;--line:#e4e4df;--card:#f4f4f0;--y:#ffd500;--r:#c4161c;--bar:rgba(255,255,255,.92);--tb:50px}
@media(prefers-color-scheme:dark){:root{--bg:#111;--ink:#f2f2f2;--mut:#a8a8a8;--line:#2b2b2b;--card:#1d1d1d;--bar:rgba(22,22,22,.92)}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--y);color:#111;padding:env(safe-area-inset-top) 6px 0}
.top{display:flex;align-items:center;gap:6px;height:44px}
#back{color:#111;text-decoration:none;font-weight:600;padding:0 8px;height:44px;display:flex;align-items:center;font-size:17px}
#back[hidden]{display:none}
#title{flex:1;font-weight:800;font-size:19px;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back:not([hidden])+#title{padding-left:0;text-align:center;margin-right:64px}
#net{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:#111;color:var(--y);margin-right:8px}
#net[hidden]{display:none}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar a{flex:1;height:var(--tb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600;position:relative}
nav.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar a.on{color:var(--ink)}
nav.tabbar a.on svg{fill:var(--y);stroke:var(--ink)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--r);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.badge:empty{display:none}
main{padding:10px 16px calc(env(safe-area-inset-bottom) + var(--tb) + 24px);max-width:760px;margin:0 auto}
h2{font-size:22px;line-height:1.2;margin:2px 0}
h3.sec{font-size:13px;font-weight:600;color:var(--mut);margin:22px 0 6px}
.mut{color:var(--mut);font-size:15px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
input[type=search]{background:var(--card);border-color:transparent}
button,.btn{font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.pri,.btn.pri{background:#111;color:#fff;border-color:#111}
@media(prefers-color-scheme:dark){button.pri,.btn.pri{background:#f2f2f2;color:#111;border-color:#f2f2f2}}
button.warn{background:var(--r);color:#fff;border-color:var(--r)}
button.link{background:none;border:0;padding:0 4px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}
button:disabled{opacity:.45}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row2>input{flex:1 1 140px}
.row2>button,.row2>.btn{flex:1 1 auto}
.sticky{position:sticky;top:calc(env(safe-area-inset-top) + 44px);z-index:4;background:var(--bg);margin:0 -16px;padding:8px 16px}
.card{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:center}
.card img,.thumb,.card .ph{width:56px;height:46px;object-fit:contain;background:#fff;border-radius:8px}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1{display:flex;align-items:center;gap:6px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y)}
@media(prefers-color-scheme:dark){.bar i{background:var(--y)}}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line);vertical-align:1px;white-space:nowrap}
.chip.ok{background:#111;color:var(--y);border-color:#111}
.chip.bad{background:var(--r);color:#fff;border-color:var(--r)}
.gh{position:sticky;top:calc(env(safe-area-inset-top) + 44px);z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0 6px;border-bottom:1.5px solid var(--ink);margin-top:10px;font-size:16px}
.gh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr{background:var(--y);color:#111;font-weight:800;font-size:17px;min-width:42px;height:32px;display:grid;place-items:center;border-radius:6px;padding:0 6px;text-decoration:none;flex:none}
.nr.none{background:var(--r);color:#fff}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);min-height:66px}
.it.done{opacity:.4}
.tap{display:contents;cursor:pointer}
.it img,.ph{width:52px;height:46px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.ph{display:grid;place-items:center;color:#8a8a8a;font-size:11px;text-align:center}
.q{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.it .tap>div{overflow:hidden}
.q{overflow:hidden;text-overflow:ellipsis}
.q small{font-size:14px;font-weight:600;color:var(--mut)}
.nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.mut{font-size:13px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.3);vertical-align:-1px;margin-right:4px}
.sw.big{width:20px;height:20px;border-radius:5px;vertical-align:-4px}
.side{display:flex;gap:6px}
.side button{min-height:44px;min-width:44px;padding:0 8px;font-size:17px}
.side .fz{background:#111;color:#fff;border-color:#111}
.it.done .side .fz{background:var(--card);color:var(--ink);border-color:var(--line)}
.bagbig{background:#111;color:var(--y);font-weight:800;font-size:18px;width:52px;height:46px;border-radius:8px;display:grid;place-items:center}
.miss{color:var(--r);font-weight:600}
.empty{color:var(--mut);padding:24px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--tb) + 14px);transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;font-size:15px}
#toast.on{opacity:1}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';font-size:22px;color:var(--mut);transition:transform .15s}
details[open]>summary::after{transform:rotate(90deg)}
textarea{min-height:120px;font:13px/1.4 ui-monospace,monospace}
.prog{font-size:14px;margin-top:6px}
.addbox{background:var(--card);border-radius:12px;padding:12px;margin:6px 0 12px}
.bagno{display:inline-block;background:#111;color:var(--y);font-weight:800;font-size:13px;padding:1px 7px;border-radius:6px;white-space:nowrap}
@media(prefers-color-scheme:dark){.bagno,.bagbig,.chip.ok{box-shadow:inset 0 0 0 1px #444}}
.seth{display:flex;gap:12px;align-items:center;margin:4px 0 2px}
.seth .bagbig{width:60px;height:52px;font-size:20px}
.seth h2{font-size:20px}
.seg{display:flex;justify-content:space-between;align-items:center;margin:6px 0 0}
.wide{width:100%;margin:8px 0}
img.big{display:block;width:100%;max-height:34vh;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);margin:6px 0}
.bignr{font-size:26px;font-weight:800;margin:2px 0}
.warnbox{background:#fff4c2;color:#4d3b00;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.errbox{background:#fde2e2;color:#6e0a0a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.okbox{background:#e3f4e1;color:#123f17;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.stat{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;margin:12px 0 2px;color:var(--mut)}
.stat b{color:var(--ink)}
.steps{display:flex;gap:4px;margin:6px 0 2px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--y)}
.stepl{font-size:13px;color:var(--mut);margin-bottom:6px}
.cand{display:grid;grid-template-columns:56px 1fr;gap:10px;width:100%;text-align:left;justify-content:stretch;padding:5px;margin:4px 0;min-height:60px;height:auto;font-weight:400}
.cand img,.cand .ph{width:56px;height:46px}
.cand.sel{border:2px solid var(--ink)}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}
.chk input{width:22px;min-height:22px}
.log{font-size:13px;line-height:1.5}
.actionbar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + var(--tb));z-index:4;background:var(--bar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);margin:12px -16px 0;padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.actionbar button{flex:1}
.capture{display:grid;grid-template-columns:110px 1fr;gap:8px}
.capture input{font-size:22px;font-weight:700;text-align:center}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.brow .cnt{text-align:right;font-weight:700;white-space:nowrap}
.brow .cnt small{display:block;font-weight:500;color:var(--mut);font-size:13px}
.recent{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.recent a{min-width:52px;height:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px)}
.mbox{background:var(--bg);color:var(--ink);border-radius:16px;padding:16px;max-width:480px;width:100%;max-height:85vh;overflow:auto}
.mbox h3{margin:0 0 8px}
.sheet{display:grid;gap:10px;margin:14px 0}
.sheet.a6{grid-template-columns:1fr 1fr}
.lbl{background:#fff;color:#111;border:1px dashed #aaa;border-radius:6px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.a5 .lbl{aspect-ratio:210/148.5}.a6 .lbl{aspect-ratio:105/148.5}
.lbl img,.lbl .ph{flex:1;min-height:0;width:100%;object-fit:contain;border:0}
.lnum{font-weight:800;font-size:28px;line-height:1.1;margin-top:6px}
.a6 .lnum{font-size:20px}
.lname{font-weight:600;font-size:15px;line-height:1.2}
.a6 .lname{font-size:12px}
.lmeta{font-size:12px;color:#555}
.lbag{font-size:13px;margin-top:6px;color:#333}
:focus-visible{outline:3px solid #0a64d8;outline-offset:2px}
@media(prefers-color-scheme:dark){.warnbox{background:#3d3200;color:#ffe680}.errbox{background:#4a1010;color:#ffc9c9}.okbox{background:#163a1a;color:#c5f0c8}}
@media(prefers-reduced-motion:reduce){#toast,summary::after{transition:none}}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  header,nav.tabbar,.noprint,#toast,.actionbar{display:none!important}
  main{padding:0;max-width:none;margin:0}
  .sheet{width:210mm;height:297mm;margin:0;gap:0;break-after:page;page-break-after:always}
  .sheet.a5{grid-template-rows:1fr 1fr}
  .sheet.a6{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .lbl{aspect-ratio:auto;border-radius:0;border:.2mm dashed #999;padding:10mm 8mm 8mm}
  .a5 .lnum{font-size:30pt}.a5 .lname{font-size:15pt}.a5 .lmeta{font-size:10pt}.a5 .lbag{font-size:12pt}
  .a6 .lnum{font-size:20pt}.a6 .lname{font-size:11pt}.a6 .lmeta{font-size:8pt}.a6 .lbag{font-size:9pt}
}
</style>
</head>
<body>
<header><div class="top"><a id="back" href="#sets" hidden>‹ Zurück</a><span id="title">Lego-Lager</span><span id="net" hidden>Offline</span></div></header>
<main id="main"><p class="empty">Lade …</p></main>
<nav class="tabbar" aria-label="Bereiche"><a href="#sets" id="t-sets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Sets</a><a href="#box" id="t-box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Kästchen</a><a href="#scan" id="t-scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Erfassen<span class="badge" id="b-scan"></span></a><a href="#shop" id="t-shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 11h10L20 7H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Einkauf</a><a href="#settings" id="t-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Mehr</a></nav>
<div id="toast" role="status"></div>
<script src="scan.js?v=3.0"></script>
<script src="backup.js?v=3.0"></script>
<script src="app.js?v=3.0"></script>
</body>
</html>
