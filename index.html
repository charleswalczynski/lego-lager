<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lego-Lager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lego-Lager</title>
<style>
:root{--bg:#fff;--ink:#111;--mut:#6b6b6b;--line:#e7e7e3;--card:#f5f5f1;--y:#ffd500;--r:#d01012;--ok:#111}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f2f2f2;--mut:#a3a3a3;--line:#2c2c2c;--card:#1c1c1c;--ok:#f2f2f2}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--y);color:#111;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;font-weight:800}
#net{font-size:13px;padding:2px 8px;border-radius:20px;background:#111;color:var(--y)}
#net.off{background:var(--r);color:#fff}
nav{display:flex;gap:2px;margin-top:8px}
nav a{flex:1;text-align:center;padding:10px 4px;text-decoration:none;color:#111;font-weight:600;border-radius:10px 10px 0 0;font-size:15px}
nav a.on{background:var(--bg);color:var(--ink)}
main{padding:12px 14px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
h2{font-size:24px;line-height:1.15;margin:4px 0 2px}
.mut{color:var(--mut);font-size:14px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.pri{background:#111;color:#fff;border-color:#111}
@media(prefers-color-scheme:dark){button.pri{background:#f2f2f2;color:#111;border-color:#f2f2f2}}
button.warn{background:var(--r);color:#fff;border-color:var(--r)}
button:disabled{opacity:.5}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row2>input{flex:1 1 160px}
.card{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:center}
.card img,.thumb{width:72px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-left:4px;vertical-align:1px}
.chip.ok{background:#111;color:var(--y);border-color:#111}
.gh{position:sticky;top:var(--hh,96px);z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0 6px;border-bottom:2px solid var(--ink);margin-top:8px}
.nr{background:var(--y);color:#111;font-weight:800;font-size:19px;min-width:46px;height:38px;display:grid;place-items:center;border-radius:6px;padding:0 6px}
.nr.none{background:var(--r);color:#fff}
.it{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.it.done{opacity:.4}
.tap{display:contents;cursor:pointer}
.it img,.ph{width:76px;height:64px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.ph{display:grid;place-items:center;color:#999;font-size:12px}
.q{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.q small{font-size:14px;font-weight:600;color:var(--mut)}
.nm{font-size:14px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.3);vertical-align:-1px;margin-right:4px}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.side button{min-height:40px;padding:0 10px;font-size:14px}
.fz{background:#111;color:#fff;border-color:#111}
.it.done .fz{background:var(--card);color:var(--ink);border-color:var(--line)}
.miss{color:var(--r);font-weight:600}
.empty{color:var(--mut);padding:24px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.on{opacity:1}
label{display:block;font-weight:600;margin:14px 0 4px}
details{margin-top:16px}
textarea{min-height:120px;font:13px/1.4 ui-monospace,monospace}
.prog{font-size:14px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Lego-Lager</h1><span id="net">online</span></div>
  <nav><a href="#sets" id="t-sets">Sets</a><a href="#shop" id="t-shop">Einkauf</a><a href="#settings" id="t-settings">Einstellungen</a></nav>
</header>
<main id="main"><p class="empty">Lade …</p></main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
